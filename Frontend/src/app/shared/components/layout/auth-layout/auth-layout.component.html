<div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-slate-50 text-slate-800">
  <!-- Brand Header -->
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-slate-900 text-white shadow-sm">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
    </div>
    <h2 class="mt-4 text-center text-2xl font-semibold tracking-tight text-slate-900">
      {{ title }}
    </h2>
    <p *ngIf="subtitle" class="mt-1 text-center text-sm text-slate-500">
      {{ subtitle }}
    </p>
  </div>

  <!-- Content Card Container -->
  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="bg-white py-8 px-6 sm:px-10 shadow-sm rounded-xl border border-slate-200">
      <ng-content></ng-content>
    </div>
  </div>
</div>
