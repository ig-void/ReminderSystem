<div
  *ngIf="message"
  class="rounded-lg border p-3.5 text-sm flex items-start gap-2.5 transition-all"
  [ngClass]="{
    'border-red-200 bg-red-50 text-red-700': type === 'error',
    'border-emerald-200 bg-emerald-50 text-emerald-700': type === 'success',
    'border-blue-200 bg-blue-50 text-blue-700': type === 'info'
  }"
  role="alert"
>
  <svg
    *ngIf="type === 'error'"
    class="h-5 w-5 flex-shrink-0 text-red-500 mt-0.5"
    viewBox="0 0 20 20"
    fill="currentColor"
    aria-hidden="true"
  >
    <path
      fill-rule="evenodd"
      d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z"
      clip-rule="evenodd"
    />
  </svg>

  <svg
    *ngIf="type === 'success'"
    class="h-5 w-5 flex-shrink-0 text-emerald-500 mt-0.5"
    viewBox="0 0 20 20"
    fill="currentColor"
    aria-hidden="true"
  >
    <path
      fill-rule="evenodd"
      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
      clip-rule="evenodd"
    />
  </svg>

  <span class="flex-1 leading-relaxed">{{ message }}</span>
</div>
