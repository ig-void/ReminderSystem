<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 overflow-y-auto"
  aria-labelledby="modal-title"
  role="dialog"
  aria-modal="true"
>
  <!-- Background backdrop -->
  <div
    class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity"
    (click)="onClose()"
  ></div>

  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <!-- Modal panel -->
    <div
      class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-slate-200"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-base font-semibold text-slate-900" id="modal-title">
          {{ title }}
        </h3>
        <button
          type="button"
          (click)="onClose()"
          class="rounded-lg p-1 text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors focus:outline-none"
          aria-label="Close modal"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Content -->
      <div class="px-6 py-5">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
