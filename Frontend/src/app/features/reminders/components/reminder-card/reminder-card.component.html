<div
  class="bg-white rounded-xl border p-5 transition-all shadow-xs hover:shadow-sm flex flex-col justify-between gap-4"
  [ngClass]="{
    'border-slate-200': !reminder.isCompleted && !isOverdue(),
    'border-amber-200 bg-amber-50/20': isOverdue() && !reminder.isCompleted,
    'border-slate-100 bg-slate-50/50 opacity-75': reminder.isCompleted
  }"
>
  <!-- Card Header & Content -->
  <div>
    <!-- Meta row: Priority, Status, Visibility -->
    <div class="flex items-center justify-between gap-2 mb-2.5">
      <div class="flex items-center gap-2 flex-wrap">
        <app-priority-badge [priority]="reminder.priority"></app-priority-badge>

        <!-- Public / Shared Tag -->
        <span
          *ngIf="reminder.isPublic"
          class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200"
        >
          <svg class="h-3 w-3 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Public
        </span>

        <!-- Creator Tag (for Others View) -->
        <span
          *ngIf="isOthersView && reminder.userFullName"
          class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-200"
        >
          <svg class="h-3 w-3 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          {{ reminder.userFullName }}
        </span>
      </div>

      <!-- Action buttons (Owner only) -->
      <div *ngIf="reminder.isOwner" class="flex items-center gap-1">
        <button
          type="button"
          (click)="onEdit()"
          class="p-1 rounded-md text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"
          title="Edit reminder"
          aria-label="Edit reminder"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>
        </button>
        <button
          type="button"
          (click)="onDelete()"
          class="p-1 rounded-md text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors"
          title="Delete reminder"
          aria-label="Delete reminder"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Title & Toggle Checkbox -->
    <div class="flex items-start gap-3">
      <button
        *ngIf="reminder.isOwner"
        type="button"
        (click)="onToggle()"
        class="mt-0.5 flex-shrink-0 h-4 w-4 rounded border flex items-center justify-center transition-colors cursor-pointer"
        [ngClass]="{
          'bg-slate-900 border-slate-900 text-white': reminder.isCompleted,
          'border-slate-300 hover:border-slate-500 bg-white': !reminder.isCompleted
        }"
        [attr.aria-checked]="reminder.isCompleted"
        role="checkbox"
      >
        <svg *ngIf="reminder.isCompleted" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </button>

      <div class="flex-1 min-w-0">
        <h3
          class="text-sm font-semibold text-slate-900 leading-snug"
          [class.line-through]="reminder.isCompleted"
          [class.text-slate-400]="reminder.isCompleted"
        >
          {{ reminder.title }}
        </h3>
        <p
          *ngIf="reminder.description"
          class="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed"
          [class.text-slate-400]="reminder.isCompleted"
        >
          {{ reminder.description }}
        </p>
      </div>
    </div>
  </div>

  <!-- Card Footer: Due Date -->
  <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
    <div class="flex items-center gap-1.5" [ngClass]="isOverdue() ? 'text-amber-700 font-medium' : 'text-slate-500'">
      <!-- Calendar SVG -->
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>{{ reminder.dueDate | date:'mediumDate' }} • {{ reminder.dueDate | date:'shortTime' }}</span>
      <span *ngIf="isOverdue()" class="text-xs font-semibold text-amber-600">(Overdue)</span>
    </div>

    <!-- Status pill -->
    <span
      class="text-[11px] font-medium"
      [ngClass]="reminder.isCompleted ? 'text-emerald-600' : 'text-slate-400'"
    >
      {{ reminder.isCompleted ? 'Completed' : 'Pending' }}
    </span>
  </div>
</div>
