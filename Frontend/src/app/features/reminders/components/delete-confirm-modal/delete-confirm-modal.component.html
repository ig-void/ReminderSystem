<app-ui-modal [isOpen]="isOpen" title="Delete Reminder" (close)="onCancel()">
  <div class="space-y-4">
    <p class="text-sm text-slate-600">
      Are you sure you want to delete
      <span class="font-semibold text-slate-900">"{{ reminderTitle }}"</span>?
      This action cannot be undone.
    </p>

    <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isDeleting"
        class="px-3.5 py-2 rounded-lg border border-slate-300 text-xs font-medium text-slate-700 hover:bg-slate-50 transition-colors focus:outline-none"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="onConfirm()"
        [disabled]="isDeleting"
        class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-rose-600 text-white text-xs font-medium hover:bg-rose-700 transition-colors focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-1 disabled:opacity-50"
      >
        <svg *ngIf="isDeleting" class="animate-spin -ml-0.5 mr-2 h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ isDeleting ? 'Deleting...' : 'Delete Reminder' }}</span>
      </button>
    </div>
  </div>
</app-ui-modal>
