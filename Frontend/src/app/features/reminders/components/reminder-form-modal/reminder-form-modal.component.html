<app-ui-modal
  [isOpen]="isOpen"
  [title]="isEditMode ? 'Edit Reminder' : 'Create New Reminder'"
  (close)="onCancel()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Title -->
    <div>
      <label for="reminder-title" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
        Title <span class="text-rose-500">*</span>
      </label>
      <input
        id="reminder-title"
        type="text"
        formControlName="title"
        placeholder="e.g., Submit monthly expense report"
        class="block w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-colors"
        [class.border-rose-500]="isFieldInvalid('title')"
      />
      <p *ngIf="isFieldInvalid('title')" class="mt-1 text-xs text-rose-600">
        Title is required (max 200 characters).
      </p>
    </div>

    <!-- Description -->
    <div>
      <label for="reminder-desc" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
        Description
      </label>
      <textarea
        id="reminder-desc"
        rows="3"
        formControlName="description"
        placeholder="Add context, details, or actionable notes..."
        class="block w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-colors resize-none"
      ></textarea>
    </div>

    <!-- Due Date & Priority Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div>
        <label for="reminder-duedate" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Due Date & Time <span class="text-rose-500">*</span>
        </label>
        <input
          id="reminder-duedate"
          type="datetime-local"
          formControlName="dueDate"
          class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-colors"
          [class.border-rose-500]="isFieldInvalid('dueDate')"
        />
        <p *ngIf="isFieldInvalid('dueDate')" class="mt-1 text-xs text-rose-600">
          Due date is required.
        </p>
      </div>

      <div>
        <label for="reminder-priority" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
          Priority Level
        </label>
        <select
          id="reminder-priority"
          formControlName="priority"
          class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-colors"
        >
          <option [value]="1">Low</option>
          <option [value]="2">Medium</option>
          <option [value]="3">High</option>
          <option [value]="4">Urgent</option>
        </select>
      </div>
    </div>

    <!-- Visibility & Completion Options -->
    <div class="pt-2 border-t border-slate-100 space-y-2">
      <!-- Public / Shared toggle -->
      <label class="flex items-center gap-2.5 cursor-pointer">
        <input
          type="checkbox"
          formControlName="isPublic"
          class="h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900 cursor-pointer"
        />
        <span class="text-xs text-slate-700">
          Make this reminder visible to other users (Public)
        </span>
      </label>

      <!-- Completed toggle (Only in Edit mode) -->
      <label *ngIf="isEditMode" class="flex items-center gap-2.5 cursor-pointer">
        <input
          type="checkbox"
          formControlName="isCompleted"
          class="h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900 cursor-pointer"
        />
        <span class="text-xs text-slate-700">
          Mark as completed
        </span>
      </label>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isSaving"
        class="px-3.5 py-2 rounded-lg border border-slate-300 text-xs font-medium text-slate-700 hover:bg-slate-50 transition-colors focus:outline-none"
      >
        Cancel
      </button>

      <button
        type="submit"
        [disabled]="isSaving || form.invalid"
        class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-medium hover:bg-slate-800 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-1 disabled:opacity-50"
      >
        <svg *ngIf="isSaving" class="animate-spin -ml-0.5 mr-2 h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ isSaving ? 'Saving...' : (isEditMode ? 'Update Reminder' : 'Create Reminder') }}</span>
      </button>
    </div>
  </form>
</app-ui-modal>
