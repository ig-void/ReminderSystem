<app-auth-layout
  title="Create an account"
  subtitle="Get started with your reminder workspace"
>
  <!-- Error Alert -->
  <div *ngIf="errorMessage()" class="mb-5">
    <app-ui-alert type="error" [message]="errorMessage()!"></app-ui-alert>
  </div>

  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Name Row -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div>
        <label for="firstName" class="block text-sm font-medium text-slate-700">First name</label>
        <div class="mt-1.5">
          <input
            id="firstName"
            type="text"
            formControlName="firstName"
            placeholder="John"
            class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-colors"
          />
        </div>
      </div>

      <div>
        <label for="lastName" class="block text-sm font-medium text-slate-700">Last name</label>
        <div class="mt-1.5">
          <input
            id="lastName"
            type="text"
            formControlName="lastName"
            placeholder="Doe"
            class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-colors"
          />
        </div>
      </div>
    </div>

    <!-- Email Field -->
    <div>
      <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
      <div class="mt-1.5 relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
          </svg>
        </div>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="name@company.com"
          autocomplete="email"
          class="block w-full rounded-lg border border-slate-300 pl-10 pr-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-colors"
          [class.border-red-500]="isFieldInvalid('email')"
        />
      </div>
      <p *ngIf="isFieldInvalid('email')" class="mt-1.5 text-xs text-red-600">
        Please provide a valid email address.
      </p>
    </div>

    <!-- Password Field -->
    <div>
      <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
      <div class="mt-1.5 relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          class="block w-full rounded-lg border border-slate-300 pl-10 pr-10 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-colors"
          [class.border-red-500]="isFieldInvalid('password')"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
          tabindex="-1"
          aria-label="Toggle password visibility"
        >
          <svg *ngIf="showPassword()" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          </svg>
          <svg *ngIf="!showPassword()" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>
      <p *ngIf="isFieldInvalid('password')" class="mt-1.5 text-xs text-red-600">
        Password must be at least 6 characters long.
      </p>
    </div>

    <!-- Confirm Password Field -->
    <div>
      <label for="confirmPassword" class="block text-sm font-medium text-slate-700">Confirm password</label>
      <div class="mt-1.5 relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <input
          id="confirmPassword"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Re-enter password"
          autocomplete="new-password"
          class="block w-full rounded-lg border border-slate-300 pl-10 pr-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition-colors"
          [class.border-red-500]="isFieldInvalid('confirmPassword') || hasPasswordMismatch()"
        />
      </div>
      <p *ngIf="hasPasswordMismatch()" class="mt-1.5 text-xs text-red-600">
        Passwords do not match.
      </p>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="isLoading() || signupForm.invalid"
      class="w-full mt-2 flex items-center justify-center py-2.5 px-4 rounded-lg bg-slate-900 text-white text-sm font-medium hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-sm"
    >
      <svg *ngIf="isLoading()" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>{{ isLoading() ? 'Creating account...' : 'Create account' }}</span>
    </button>
  </form>

  <!-- Footer Link -->
  <div class="mt-6 pt-6 border-t border-slate-100 text-center">
    <p class="text-sm text-slate-500">
      Already have an account?
      <a routerLink="/login" class="font-medium text-slate-900 hover:text-slate-700 underline underline-offset-4">
        Sign in
      </a>
    </p>
  </div>
</app-auth-layout>
