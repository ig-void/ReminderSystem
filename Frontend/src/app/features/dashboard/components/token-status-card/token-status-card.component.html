<div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
  <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
    <h2 class="text-sm font-semibold text-slate-900">Authentication & Health</h2>
    <span class="text-xs text-slate-500 font-mono">http://localhost:5062</span>
  </div>
  <div class="p-6 space-y-4">
    <div class="flex items-center justify-between text-sm">
      <span class="text-slate-500">JWT Access Token</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-800">
        Active in Storage
      </span>
    </div>
    <div class="flex items-center justify-between text-sm">
      <span class="text-slate-500">Refresh Token Rotation</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-800">
        Configured (7 Days)
      </span>
    </div>

    <div class="pt-2">
      <button
        type="button"
        (click)="testProtectedEndpoint()"
        [disabled]="isTesting()"
        class="w-full flex items-center justify-center gap-2 py-2 px-4 rounded-lg border border-slate-300 text-xs font-medium text-slate-800 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-colors disabled:opacity-50"
      >
        <svg *ngIf="isTesting()" class="animate-spin h-3.5 w-3.5 text-slate-700" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>

        <svg *ngIf="!isTesting()" class="h-3.5 w-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>

        <span>{{ isTesting() ? 'Verifying /api/auth/me...' : 'Test Protected API Call (/api/auth/me)' }}</span>
      </button>
    </div>

    <div *ngIf="testResult()" class="mt-3 p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono text-slate-700 overflow-x-auto max-h-32">
      {{ testResult() }}
    </div>
  </div>
</div>
